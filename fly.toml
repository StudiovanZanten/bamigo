# Fly.io: 1 machine + volume (SQLite). Deploy gaat automatisch via GitHub Actions.
app = "bamigo-muchachos"
primary_region = "ams"

[build]

[env]
  PUBLIC_URL = "https://bamigo-muchachos.fly.dev"

[mounts]
  source = "bamigo_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # tijdens de avond niet in slaap vallen
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/health"

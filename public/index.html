<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151515">
<title>BAMIGO — Quizzen & spelavonden</title>
<link rel="stylesheet" href="/css/bamigo.css">
<script type="module" src="/js/index.js"></script>
</head>
<body>
<main class="wrap center" style="padding-top:12vh">
  <div class="tagline" style="color:var(--champagne);margin-bottom:18px">Muchacho’s / januari 2027</div>
  <h1 class="brand xl" style="margin:0">BAMIGO</h1>
  <div class="tagline copper" style="margin-top:14px">Quizzen &amp; spelavonden</div>
  <div class="tagline" style="margin-top:8px">Maak er een avond van.</div>
  <form id="f" class="card" style="margin-top:40px;text-align:left">
    <label for="code">Spelcode</label>
    <input id="code" class="code" maxlength="8" autocomplete="off" autocapitalize="characters" required>
    <button class="btn primary block big" style="margin-top:14px">Meedoen</button>
  </form>
  <p style="margin-top:28px"><a href="/beheer">Organiseren</a></p>
</main>
